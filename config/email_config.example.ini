; 邮件报警配置示例(QQ 邮箱)
;
; 使用方法:
;   1. 复制本文件为同目录下的 email_config.ini
;   2. 填入实际值(下方注释有获取方法)
;   3. 重启应用即可生效
;
; 获取 QQ 邮箱 SMTP 授权码:
;   - 登录 QQ 邮箱 → 设置 → 账户 → POP3/SMTP 服务
;   - 开启"IMAP/SMTP 服务" → 生成授权码(16 位)
;   - password 字段填授权码,不是 QQ 密码
;
; 安全提示:
;   - email_config.ini 含敏感凭证,不要提交到 git
;   - 项目根目录的 .gitignore 已默认忽略 config/email_config.ini

[smtp]
; SMTP 服务器(QQ 邮箱默认 smtp.qq.com)
host = smtp.qq.com

; 端口(465=SSL 直连,587=STARTTLS)
port = 465

; 发件邮箱(完整 QQ 邮箱地址,如 123456@qq.com)
user = your_qq_number@qq.com

; SMTP 授权码(不是 QQ 密码,16 位字母)
password = your_16char_authorization_code

; 收件人邮箱(多个用英文逗号分隔)
to = ops_team@example.com

; 发件人显示名
from_name = 设备测试数据助手
