; AI 助手配置示例(OpenAI 兼容接口)
;
; 使用方法:
;   1. 复制本文件为同目录下的 llm_config.ini
;   2. 填入实际值(下方注释有常见 LLM 服务商配置方法)
;   3. 重启应用即可生效
;
; 常见 LLM 服务商配置:
;
; 【智谱 GLM(推荐国内使用)】
;   base_url = https://open.bigmodel.cn/api/paas/v4
;   model    = glm-4-flash  (或 glm-4 / glm-4-plus)
;   api_key  = 在 https://open.bigmodel.cn 注册后创建
;
; 【通义千问】
;   base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
;   model    = qwen-turbo  (或 qwen-plus / qwen-max)
;   api_key  = 在 https://dashscope.console.aliyun.com 创建 DashScope 专用 API key (sk- 开头)
;              注意:不是阿里云 RAM 的 AccessKey ID(LTAI 开头),那是给阿里云 SDK 用的
;
; 【OpenAI】
;   base_url = https://api.openai.com/v1
;   model    = gpt-4o-mini  (或 gpt-4o / gpt-3.5-turbo)
;   api_key  = 在 https://platform.openai.com 创建
;
; 安全提示:
;   - llm_config.ini 含 API key,不要提交到 git
;   - 项目 .gitignore 默认忽略 config/llm_config.ini

[llm]
; LLM 服务商 API 地址(末尾不要加 /v1,代码会自动补)
base_url = https://open.bigmodel.cn/api/paas/v4

; API key
api_key = your_api_key_here

; 模型名
model = glm-4-flash

; 温度(0=严谨,1=发散,推荐 0.3 客服场景)
temperature = 0.3

; 单次回答最大 token 数
max_tokens = 1500
